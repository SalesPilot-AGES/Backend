services:
  db:
    image: postgres:17
    container_name: salespilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: salespilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: heroi12345
    ports:
      - "5433:5432"
    volumes:
      - salespilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salespilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: salespilot-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salespilot-api
    restart: "no"
    environment:
      DB_URL: jdbc:postgresql://db:5432/salespilot
      DB_USER: postgres
      DB_PASSWORD: heroi12345
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  salespilot_pgdata:
