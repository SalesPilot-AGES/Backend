# Additive test overrides, layered on top of the main application.properties when
# the "test" profile is active. The DataSource is provided by Testcontainers via
# @ServiceConnection; here we only supply concrete values for the env-var-driven
# properties that have no defaults, so the context can bootstrap without external env.

# JPA / Hibernate (schema is owned by Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public

# Flyway (fresh container, no baseline needed)
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false

# Security / JWT (dummy values, only needed for context binding)
app.security.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
app.security.jwt.issuer=salespilot-test
app.security.jwt.access-ttl-seconds=3600
app.security.jwt.refresh-ttl-seconds=86400
