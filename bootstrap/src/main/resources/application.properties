spring.application.name=api

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/salespilot}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# SQL Initialization (data.sql)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator / Metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.schemas=public,auth
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_existing_schema

# Security / JWT
app.security.jwt.secret=${JWT_SECRET:salespilot-secret-key-super-secret}
app.security.jwt.issuer=${JWT_ISSUER:salespilot-api}
app.security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL:1800}
app.security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL:2592000}
