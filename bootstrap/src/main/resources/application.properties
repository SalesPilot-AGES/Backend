spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salespilot}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

app.seed.company.enabled=${APP_SEED_COMPANY_ENABLED:true}
app.seed.collaborator.enabled=${APP_SEED_COLLABORATOR_ENABLED:true}