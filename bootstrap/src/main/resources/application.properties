spring.application.name=api

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator / Metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.default-schema=${DB_SCHEMA}
spring.flyway.schemas=public,auth
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_existing_schema

# Security / CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Security / JWT
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL}
app.security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL}
